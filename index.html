<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>InfiniBoard Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/pro-upgrade.css">
</head>
<body>
<div id="splash"><div class="spin"></div><b>InfiniBoard Pro</b></div>
<div id="app">
  <div id="home"></div>
  <div id="board">
    <div id="topbar"></div>
    <div id="toolbar"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="embeds"></div>
      <canvas id="ov"></canvas>
      <div id="editor"></div>
      <canvas id="lcv"></canvas>
      <div id="sb-h" class="sb"><i></i></div>
      <div id="sb-v" class="sb"><i></i></div>
      <div id="minimap"><canvas></canvas></div>
      <div id="ctxbar"></div>
      <div id="zoombar"></div>
    </div>
    <div id="panel"></div>
  </div>
</div>
<div id="dropzone"><div><b>Drop files here</b><span>Images, videos, audio, PDFs, documents, text…</span></div></div>
<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/doc.js"></script>
<script src="js/render.js"></script>
<script src="js/shapes.js"></script>
<script src="js/pen.js"></script>
<script src="js/conn.js"></script>
<script src="js/media.js"></script>
<script src="js/adv.js"></script>
<script src="js/editor.js"></script>
<script src="js/act.js"></script>
<script src="js/tools.js"></script>
<script src="js/extras.js"></script>
<script src="js/io.js"></script>
<script src="js/panels.js"></script>
<script src="js/toolbar.js"></script>
<script src="js/study.js"></script>
<script src="js/study-ui.js"></script>
<script src="js/study-pro.js"></script>
<script src="js/pdf-ultra.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/app.js"></script>
<script src="js/canvas-pro.js"></script>
</body>
</html>
